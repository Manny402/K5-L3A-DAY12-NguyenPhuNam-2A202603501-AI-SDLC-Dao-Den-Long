<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đảo Đèn Lồng</title><style>
body{margin:0;background:#0E1430;color:#F5F1E6;font:18px system-ui;overflow:hidden}canvas{display:block}#hud{position:absolute;inset:0;pointer-events:none;padding:18px;box-sizing:border-box}#top{display:flex;justify-content:space-between}#lights{color:#F2C14E}#bottom{position:absolute;bottom:20px;left:20px;background:#0E1430bb;padding:12px;border-radius:12px}#center{position:absolute;inset:0;display:grid;place-items:center;text-align:center}#panel{background:#0E1430df;padding:28px;border:2px solid #F2C14E;border-radius:16px;pointer-events:auto;max-width:560px}button{font:inherit;background:#FFB347;border:0;padding:12px 24px;cursor:pointer;border-radius:8px;margin:4px}#hint{position:absolute;bottom:85px;left:50%;transform:translateX(-50%);background:#0E1430bb;padding:8px;border-radius:8px}input{font:inherit}
